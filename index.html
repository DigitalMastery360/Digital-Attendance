<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student QR Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #123b63;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
    }

    #result {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      color: #123b63;
    }
  </style>
</head>

<body>
  <h2>Student QR Attendance</h2>
  <p>Scan your student ID QR code</p>

  <div id="reader"></div>
  <div id="result">Waiting for scan...</div>

  <script>
    function onScanSuccess(decodedText) {
      document.getElementById("result").innerText =
        "Scanned Student ID: " + decodedText;

      scanner.clear();
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      false
    );

    scanner.render(onScanSuccess);
  </script>
</body>
</html>
